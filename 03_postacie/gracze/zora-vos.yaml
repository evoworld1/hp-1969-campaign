wyglad: Drobna, żylasta, ciemne włosy związane byle jak, na palcach ślady smaru i atramentu, w kieszeniach
  zawsze śrubki i kawałek drutu.
charakter: Spostrzegawcza, ambitna i towarzyska, z ciętym humorem. Ceni pomysłowość i jest lojalna wobec
  przyjaciół. Niechętnie przyznaje się do błędów. W pracowni matki nauczyła się cierpliwie sprawdzać,
  dlaczego coś nie działa.
sekret: Nigdy nie poznała ojca, a matka milczy na jego temat. Zora nie wie, czy jest czystej, czy półkrwi,
  i ukrywa tę niewiedzę przed innymi.
osoba_bliska: Matka, która prowadzi pracownię naprawy magicznych przedmiotów w Yorku.
wakacje_1969: 'Pomagała matce w pracowni: lampy, kompasy i ciężka torba cudzych zepsutych drobiazgów do
  poskładania.'
haczyki_mg:
- 'Niewiedza o ojcu: ktoś w Slytherinie (albo Cassian/Pożyczający) wie więcej o jej pochodzeniu niż ona;
  pokusa, by to sprawdzić.'
- 'Naprawianie: zepsuty albo zatrzymany mechanizm (zegar, zegarek, zamek) to jej naturalny punkt wejścia
  (Crafting 6, specjalizacja Naprawa magicznych przedmiotów, Specialis Revelio); zaklęcia ujawniające
  nie pokażą magii czasu (ZD-24), ale ona zobaczy, że coś nie gra.'
- 'Pojedynki: wygrywa refleksem i pomysłem (Speed 6, Wits 6, Duelling 4, Expelliarmus, Flipendo, Trip
  Jinx, Everte Statum); w pokazie Wrena jest naturalną kandydatką na ochotniczkę.'
- 'Slytherin: dormitorium w lochach daje jej dostęp do poszlak o Cassianie, którego inni nie mają.'
- 'Duma: nie przyzna się, że czegoś nie wie; MG może ją o to przyłapać przy świadkach.'
- 'Różdżka z drugiej ręki z rdzeniem z włosa kelpie: do wykorzystania jako zagadka (kto jej używał, dlaczego
  trafiła do sklepu z używanymi).'
notatki_mg:
- 'Zmiany względem v1 (powód: opis gracza). Cechy bez zmian (Speed 6 i Wits 6 pasują do pojedynków refleksem
  i pomysłem).'
- 'Umiejętności: Crafting 2 -> 6 (pracownia matki, naprawianie), specjalizacja Crafting (Naprawa magicznych
  przedmiotów) zamiast Charms (Naprawianie); Duelling 0 -> 4 (lubi pojedynki); Stealth 5 i Concealment
  4 usunięte (nie wynikały z opisu), zamiast nich Observation, Balance, Strategy; Chicanery 5 -> 2; Muggle
  Studies 2 -> 1, Ancient Runes 3 (runy na magicznych przedmiotach, wchodzi do SUM-ów).'
- 'Przedmioty 6. roku: Charms, Transfiguration, D.A.D.A., Ancient Runes, Magical Theory (v1: Charms, Transfiguration,
  D.A.D.A., Potions); Potions spada do 1, bo opis o eliksirach milczy.'
- 'Różdżka: v1 Mahogany + Phoenix Feather (Transfiguration +3), v2 Aspen + Kelpie Hair (Charms +1, Duelling
  +1, Transfiguration +2, Water Magic +1, bez Wand Loyalty), bo Zora lubi i transmutację, i pojedynki;
  rdzeń z włosa kelpie jest z listy rdzeni s. 26 (kolumna różdżek rodowych i starych) i pasuje do różdżki
  z drugiej ręki.'
- 'Zaklęcia: dojście zestawu naprawczego (Specialis Revelio, Switching Spell, Spongify, Reducio, Engorgio,
  Feather-light Charm, Duro, Incendio) i szybkich zaklęć pojedynkowych (Flipendo, Rictustempra, Impedimenta,
  Everte Statum, Trip Jinx); usunięte Aparecium, Episkey, Revelio, Disillusionment Charm, Confundo, Silencio,
  Quietus, Obliteration Charm, Cistem Aperio. Protego opanowane (pojedynki, s. 165). Magia zaawansowana:
  Draught of Peace zamiast Ageing Potion.'
- 'Pochodzenie, imię, dom, sekret i reszta fabuły bez zmian. Wygląd, osoba bliska, wakacje: PROPOZYCJE
  z v1, gracz nie podał. Zwierzę towarzyszące: gracz wpisuje sam (sowa, kot albo ropucha, własne imię).
  Cecha rzadka: brak (MG rzuci przy stole).'
pewnosc: nasze
