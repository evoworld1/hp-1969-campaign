wyglad: Wysoka, w za dużym swetrze, włosy w nieładzie; w kieszeni notes z mapami nieba, a na szyi łańcuszek
  z maleńką szklaną fiolką.
charakter: Roztargniona w drobiazgach (zapomina o wodzie na herbatę), ale gdy coś ją pochłonie, staje
  się drobiazgowa i bardzo dokładna. Towarzyska, łatwo zawiera znajomości, za przyjaciółmi stoi murem,
  także wtedy, gdy rozsądniej byłoby siedzieć cicho. Uwielbia astronomię i eliksiry; prowadzi własne mapy
  nieba i sprawdza, czy fazy Księżyca wpływają na mikstury.
sekret: Boi się ciemności. Nauczyła się łapać blask gwiazd w małe szklane fiolki; nocą otwiera jedną przy
  łóżku i rozświetla mrok własnym gwiaździstym niebem.
osoba_bliska: Matka, która pierwsza pokazała jej gwiazdozbiory z okna w Oksfordzie.
wakacje_1969: W Oksfordzie z rodzicami; kilka nocy na dachu z mapami nieba i fiolkami do łapania światła.
haczyki_mg:
- 'Strach przed ciemnością: scena w mroku (lochy, zgaszone pochodnie, stracona godzina bez światła) bije
  w nią mocniej; fiolka z gwiazdą to jej latarnia.'
- 'Stracona godzina: jej mapy nieba i notatki o Księżycu mogą pokazać, że niebo w tej godzinie ''nie przesunęło
  się'' (do ustalenia przez MG).'
- 'Ojciec w Ministerstwie: kontakt do kogoś, kto zna procedury; ale też lojalność wobec przyjaciół wbrew
  rozsądkowi.'
- 'Eliksiry i Księżyc: eksperyment, który wymaga wyjścia nocą, wciąga ją w sprawę.'
notatki_mg:
- Ród Longbottom wybrany przeze mnie (Herbology 2 pasuje do eliksirów); do zmiany, jeśli MG woli inny
  z s. 7.
- 'Różdżka: Vine + Phoenix Feather zgodnie z archetypem B; długość i giętkość dobrane. Blask gwiazdy w
  rękojeści to opis gracza, bez efektu mechanicznego.'
- 'Wygląd, osoba bliska, wakacje, imię sowy: PROPOZYCJE, gracz nie podał.'
- 'Cecha rzadka: brak (MG rzuci przy stole).'
pewnosc: nasze
