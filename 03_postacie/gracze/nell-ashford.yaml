wyglad: Wysoka, w za dużym swetrze, włosy w nieładzie; w kieszeni notes z mapami nieba, a na szyi łańcuszek
  z maleńką szklaną fiolką.
charakter: Roztargniona w drobiazgach (zapomina o wodzie na herbatę), ale gdy coś ją pochłonie, staje
  się drobiazgowa i bardzo dokładna. Towarzyska, łatwo zawiera znajomości, za przyjaciółmi stoi murem,
  także wtedy, gdy rozsądniej byłoby siedzieć cicho. Uwielbia astronomię i eliksiry; prowadzi własne mapy
  nieba i sprawdza, czy fazy Księżyca wpływają na mikstury.
sekret: Boi się ciemności. Nauczyła się łapać blask gwiazd w małe szklane fiolki; nocą otwiera jedną przy
  łóżku i rozświetla mrok własnym gwiaździstym niebem.
osoba_bliska: Matka, która pierwsza pokazała jej gwiazdozbiory z okna w Oksfordzie.
wakacje_1969: W Oksfordzie z rodzicami; kilka nocy na dachu z mapami nieba i fiolkami do łapania światła.
haczyki_mg:
- 'Strach przed ciemnością: scena w mroku (lochy, zgaszone pochodnie, stracona godzina bez światła) bije
  w nią mocniej; fiolka z gwiazdą to jej latarnia (przedmiot, nie zaklęcie).'
- 'Stracona godzina: jej mapy nieba i notatki o Księżycu mogą pokazać, że niebo w tej godzinie ''nie przesunęło
  się'' (do ustalenia przez MG); Astronomy 7 ze specjalizacją.'
- 'Ojciec w Ministerstwie: kontakt do kogoś, kto zna procedury (Authority 1, Prestige 3 w sumie); ale
  też lojalność wobec przyjaciół wbrew rozsądkowi.'
- 'Eliksiry i Księżyc: eksperyment, który wymaga wyjścia nocą, wciąga ją w sprawę; Polyjuice wymaga szczeci
  zbieranej w pełni księżyca (s. 63), więc jej notatki to realny atut.'
- 'Towarzyskość: Persuasion 5 ze specjalizacją; potrafi zagadać prefektów i portrety, ale nie umie kłamać
  z kamienną twarzą (Chicanery 0).'
notatki_mg:
- 'Zmiany względem v1 (powód: opis gracza). Cechy: Knowledge 6 -> 7 (eliksiry, astronomia, drobiazgowość),
  Focus 5 -> 4; reszta bez zmian (v1: Vitality 3, Speed 3, Wits 5, Knowledge 6, Focus 5; v2: 3/3/5/7/4).'
- 'Ród: Longbottom -> Macmillan (Authority 1, Prestige 2), bo ojciec szkoli pracowników Ministerstwa;
  Herbology z rodu (v1 Herbology 5) zastąpione własną pulą. Do zmiany, jeśli MG woli inny ród z s. 7.'
- 'Umiejętności: Astronomy 3 -> 7 i Potions 3 -> 6 (główne pasje) ze specjalizacjami; Arithmancy 3 (obliczenia
  faz Księżyca); Art 3 (rysowane mapy nieba); Persuasion 2 -> 5 (towarzyska, lojalna); Archivist 5 ->
  3, History of Magic 4 -> 1, Ancient Runes 4 -> 0 (nie wynikają z opisu); Stealth 1 -> 0.'
- 'Przedmioty 6. roku: Astronomy, Potions, Arithmancy, Herbology, Charms, D.A.D.A. (jak v1). D.A.D.A.
  3 jest potrzebne do grupy ćwiczeniowej Wrena.'
- 'Różdżka bez zmian (Vine + Phoenix Feather, archetyp B): Revealing Magic +2 pasuje do jej zaklęć badawczych.
  Blask gwiazdy w rękojeści to opis gracza, bez efektu mechanicznego.'
- 'Zaklęcia: usunięte Nox (strach przed ciemnością; Lumos opanowane), Colloportus, Intruder Charm, Cistem
  Aperio, Obliteration Charm (nie wynikają z opisu); dodane Scourgify, Tergeo, Demitto Ignem, Impervius
  (praca w pracowni z kociołkiem i szkłem). Bluebell Flames, Specialis Revelio, Homenum Revelio, Prior
  Incantato, Flagrate, Stupefy, Rennervate, Cheering Charm, Quietus zostają. Magia zaawansowana: osiem
  eliksirów (bez Shrinking Solution), Aguamenti i nowy Cave Inimicum.'
- 'Wygląd, osoba bliska, wakacje, imię sowy: PROPOZYCJE z v1, gracz nie podał. Cecha rzadka: brak (MG
  rzuci przy stole).'
