wyglad: Wysoka, z burzą włosów w kolorze miedzi i kocią sierścią na rękawach; nosi amerykańskie trampki
  pod szkolną szatą.
charakter: Dumna i ambitna, ale roztargniona na tyle, że często nie umie się na nic zdecydować. Kocha
  magiczne stworzenia i zwierzęta mugoli. Lubi warzyć eliksiry, zwłaszcza lecznicze, bo chce leczyć chore
  stworzenia magiczne.
sekret: Potajemnie ciągną ją mroczniejsze zagadnienia magii. Nie użyłaby zaklęć niewybaczalnych, ale inne
  czarne praktyki ją pociągają.
osoba_bliska: Babcia w Londynie, u której mieszka w przerwach.
wakacje_1969: U babci w Londynie; opiekowała się rannym gołębiem i szukała w księgarniach starych książek
  o stworzeniach (i, po cichu, o mroczniejszych sprawach).
haczyki_mg:
- 'Zainteresowanie mroczną magią (decyzja MG 2026-11-22): ma Dark Arts 3, czyli wyjątek od zasady „Dark
  Arts 0”, uzasadniony potajemną lekturą; księga w bibliotece (zakazana albo zaklęta) działa na nią jak
  magnes. W scenie 09 (Dział Ksiąg Zakazanych) może za cenę czasu i hałasu poznać jedno silniejsze zaklęcie
  czarnej magii (propozycja: 99_robocze/klatwa-luny-propozycja.md, czeka na wybór MG).'
- 'Taco: kot może reagować na miejsca i osoby, przy których ''coś jest nie tak'' (propozycja MG, bez efektu
  mechanicznego).'
- 'Amerykańska przeszłość: spojrzenie z zewnątrz na brytyjską czystość krwi i napięcia przed wojną; Muggle
  Studies 4 daje jej wiedzę o mugolach, której inni nie mają.'
- 'Rzadkie leczenie: ranny uczeń albo stworzenie to sceny, w których Potions 7 (Eliksiry lecznicze), Magical
  Creatures 5, Healing Magic z różdżki i Herbology dają jej głos.'
- 'Złośliwe uroki: jej zestaw (Slugulus Eructo, Furnunculus, Densaugeo, Locomotor Mortis, Mimblewimble)
  to szkolne psikusy, ale Slugulus Eructo i Locomotor Mortis wymagają Dark Arts; nauczyciel, który zobaczy
  je w użyciu, może zapytać, skąd je zna.'
notatki_mg:
- 'Zmiany względem v1 (powód: opis gracza). Cechy: v1 5/3/4/5/5, v2 4/3/4/6/5 (Knowledge 6: zdolna uczennica
  i eliksiry, Vitality 4); Speed 3 i Wits 4 bez zmian (roztargniona).'
- 'DARK ARTS 3 (decyzja MG 2026-11-22): wyjątek od zasady „Dark Arts 0” z instrukcji tworzenia postaci
  i s. 22; uzasadnienie: potajemna lektura mrocznych zagadnień. Podręcznik dopuszcza taki wyjątek, jeśli
  uzasadnia go historia postaci (zob. zasada.walker-tworzenie-postaci, Jak używać przy stole). Punkty
  z puli b (3 dowolne).'
- 'Umiejętności: Potions 4 -> 7 (specjalizacja Eliksiry lecznicze) i Magical Creatures 5 (specjalizacja
  Choroby i rany stworzeń, jak v1); Muggle Studies 0 -> 4 (Nowy Jork); Herbology 6 -> 3 (nie jest w opisie,
  tylko Herbology z rodu Abbot); Persuasion 4 -> 1, Observation 5 -> 4, Riding 3 -> 2, Music, Swimming,
  Tracking, Authority, Crafting usunięte (nie wynikają z opisu). Dodane Concealment 3, Archivist 2, Prestige
  3 (dumna, sekret, cicha lektura). Ród Abbot bez zmian.'
- 'Przedmioty 6. roku: Potions, Magical Creatures, Muggle Studies, Charms, D.A.D.A., Herbology (v1 bez
  Muggle Studies); wszystkie ≥ 3 punkty.'
- 'Różdżka: v1 Chestnut + Unicorn Hair (Healing +2, Protective +2), v2 Hawthorn + Dittany Stalk (Herbology
  +3, Healing Magic +1, Curses +1); głóg to drewno leczące i przeklinające naraz, a Curses +1 liczy się
  do jej Slugulus Eructo, Locomotor Mortis i Mimblewimble. Rdzeń Dittany Stalk jest w kolumnie różdżek
  rodowych (s. 26), a nietypowy rdzeń pasuje do różdżki po pra-pra-prababci.'
- 'Zaklęcia: usunięte Salvio Hexia, Arresto Momentum, Demitto Ignem, Confundo, Petrificus Totalus; dodane
  Mimblewimble, Furnunculus, Densaugeo, Slugulus Eructo, Locomotor Mortis (razem 11 kratek; Furnunculus,
  Slugulus Eructo i Locomotor Mortis to wg indeksu zaklęcia pozaprogramowe, więc liczone do puli 50 za
  zgodą MG); Bluebell Flames (światło dla stworzeń). Protego opanowane. Magia zaawansowana: dziewięć pozycji
  jak v1 bez Polyjuice Potion, plus Love Potion Antidote.'
- 'Wygląd, wakacje: PROPOZYCJE z v1, gracz nie podał. Cecha rzadka: brak (MG rzuci przy stole).'
