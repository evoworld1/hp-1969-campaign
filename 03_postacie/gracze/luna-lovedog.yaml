wyglad: Wysoka, z burzą włosów w kolorze miedzi i kocią sierścią na rękawach; nosi amerykańskie trampki
  pod szkolną szatą.
charakter: Dumna i ambitna, ale roztargniona na tyle, że często nie umie się na nic zdecydować. Kocha
  magiczne stworzenia i zwierzęta mugoli. Lubi warzyć eliksiry, zwłaszcza lecznicze, bo chce leczyć chore
  stworzenia magiczne.
sekret: Potajemnie ciągną ją mroczniejsze zagadnienia magii. Nie użyłaby zaklęć niewybaczalnych, ale inne
  czarne praktyki ją pociągają.
osoba_bliska: Babcia w Londynie, u której mieszka w przerwach.
wakacje_1969: U babci w Londynie; opiekowała się rannym gołębiem i szukała w księgarniach starych książek
  o stworzeniach.
haczyki_mg:
- 'Zainteresowanie mroczną magią: księga w bibliotece (zakazana albo zaklęta) działa na nią jak magnes;
  Dark Arts na karcie zostaje 0.'
- 'Taco: kot może reagować na miejsca i osoby, przy których ''coś jest nie tak'' (propozycja MG, bez efektu
  mechanicznego).'
- 'Amerykańska przeszłość: spojrzenie z zewnątrz na brytyjską czystość krwi i napięcia przed wojną.'
- 'Rzadkie leczenie: ranny uczeń albo stworzenie to sceny, w których Healing Magic i Herbology dają jej
  głos.'
notatki_mg:
- Ród Abbot wybrany przeze mnie (Herbology 1 pasuje); nazwisko Lovedog nie jest na liście, więc ród to
  linia matki albo babci. Do potwierdzenia.
- 'Różdżka: rodzinna (Legacy) z rdzeniem z archetypu D; rdzenie rodowe mogą być nietypowe (s. 26), MG
  może to zmienić.'
- 'Wygląd, wakacje: PROPOZYCJE, gracz nie podał. Imię Taco i kot z opisu gracza.'
- 'Cecha rzadka: brak (MG rzuci przy stole).'
pewnosc: nasze
