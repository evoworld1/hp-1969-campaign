zaklecia:
  Accio: {opis: "Przywołuje przedmiot do rzucającego."}
  Aguamenti: {opis: "Strumień wody z końca różdżki."}
  Alohomora: {opis: "Otwiera zamknięte na zamek drzwi i szkatułki."}
  Aparecium: {opis: "Ujawnia niewidzialny atrament i ukryte wiadomości."}
  Arresto Momentum: {opis: "Spowalnia ruch, może uratować przy upadku."}
  Bluebell Flames: {opis: "Niebieskie, bezpieczne płomyki, które można nosić w dłoni lub słoiku."}
