  Cave Inimicum: {opis: "Chroni miejsce niewidzialną barierą przed wrogami."}
  Cheering Charm: {opis: "Poprawia nastrój osoby, w którą trafi."}
  Cistem Aperio: {opis: "Otwiera skrzynie i pudła, które nie są zamknięte magicznie."}
  Colloportus: {opis: "Zamyka drzwi magicznie."}
  Confundo: {opis: "Dezorientuje cel, który traci orientację."}
  Diffindo: {opis: "Precyzyjnie tnie przedmiot."}
  Disillusionment Charm: {opis: "Barwi rzucającego jak otoczenie, prawie niewidzialność."}
  Episkey: {opis: "Leczy drobne urazy."}
  Expelliarmus: {opis: "Wytrąca cel z dłoni trzymany przedmiot."}
  Extinguishing Charm: {opis: "Gasi ogień."}
  Finite Incantatem: {opis: "Ogólne przeciwzaklęcie kończące trwające zaklęcie."}
  Flagrate: {opis: "Ognisty znak lub pismo wiszące w powietrzu."}
  Homenum Revelio: {opis: "Wykrywa ukryte w pobliżu osoby."}
  Immobulus: {opis: "Zatrzymuje cel w bezruchu na rundę."}
  Impedimenta: {opis: "Spowalnia i zatrzymuje cel, który traci akcje."}
  Impervius: {opis: "Czyni przedmiot lub szkło wodoodpornym."}
  Incarcerous: {opis: "Wyczarowuje więzy z powietrza."}
  Incendio: {opis: "Płomień z różdżki; rani lub rozpala ogień."}
  Intruder Charm: {opis: "Ostrzega, gdy ktoś wejdzie w zaczarowane miejsce."}
  Locomotor: {opis: "Unosi i przesuwa przedmiot po powietrzu."}
  Lumos: {opis: "Światło na końcu różdżki."}
  Nox: {opis: "Gasi światło Lumos."}
  Obliteration Charm: {opis: "Zaciera ślady stóp i inne ślady."}
  Petrificus Totalus: {opis: "Całkowicie unieruchamia cel."}
  Prior Incantato: {opis: "Pokazuje echo ostatniego zaklęcia, które wyszło z różdżki."}
  Protean Charm: {opis: "Powiązane przedmioty zmieniają się razem."}
  Protego: {opis: "Tarcza, która osłabia zaklęcie lecące w rzucającego."}
  Quietus: {opis: "Ścisza dźwięk, np. wzmocniony głos."}
  Rennervate: {opis: "Budzi osobę ogłuszoną."}
  Reparo: {opis: "Naprawia zepsuty przedmiot (nie różdżkę)."}
  Revelio: {opis: "Ujawnia ukryte rzeczy, przejścia i przebrania."}
  Rictustempra: {opis: "Łaskotki rozpraszające cel."}
  Salvio Hexia: {opis: "Odbija szkodliwe uroki z chronionego miejsca."}
  Silencio: {opis: "Odbiera celowi głos."}
  Specialis Revelio: {opis: "Pokazuje zaklęcia na przedmiocie lub w eliksirze."}
  Spongify: {opis: "Zmiękcza powierzchnię jak gąbkę."}
  Stupefy: {opis: "Oszołomienie: ogłusza cel."}
  Wingardium Leviosa: {opis: "Unosi przedmiot w powietrzu."}
  Ageing Potion: {opis: "Eliksir postarzający wypijającego."}
  Calming Draught: {opis: "Uspokaja po szoku."}
  Draught of Peace: {opis: "Wywar Spokoju, łagodzi niepokój."}
  Elixir to Induce Euphoria: {opis: "Wywołuje euforię."}
  Love Potion Antidote: {opis: "Odtrutka na eliksir miłosny."}
  Polyjuice Potion: {opis: "Eliksir Wielosokowy, zmienia wygląd na cudzy."}
  Shrinking Solution: {opis: "Zmniejsza to, na co się go wyleje."}
  Sleeping Draught: {opis: "Eliksir nasenny."}
  Wound-cleaning Potion: {opis: "Oczyszcza rany z zakażeń i trucizn."}
