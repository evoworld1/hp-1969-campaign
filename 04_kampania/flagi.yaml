# Rejestr flag stanu kampanii, opis w docs/KONTRAKT-DANYCH.md, rozdział 6.
# Każda flaga użyta w scenach (flagi_wejscie, flagi_wyjscie, wymaga_flag, flagi_ustaw…) musi być tu zdefiniowana.
# Flagi dopisuje architekt-fabuly. Wartości w trakcie gry zapisuje kronikarz w stan-kampanii.md.
#
# Wzór:
#   - id: flaga.cassian-zdemaskowany
#     opis: "Gracze wiedzą, że Cassian kradnie czas."
#     typ: bool          # bool | liczba | wybor
#     wartosci: []       # tylko dla typu „wybor”
#     sesja: s1
#
# Uwaga: liczniki Więź z Anselem, Zegar Północy i Rejestr Danin to kandydaci na pliki `tracker`
# (tracker.wiez-ansel, tracker.zegar-polnocy, tracker.rejestr-danin). Powstaną po decyzji MG,
# nie są flagami. Poniżej tylko flagi i jeden zegar świata Sesji 1 (flaga.s1-zegar-kradziezy).

flagi:
  # --- Sesja 1: start i tło ---
  - id: flaga.s1-prolog-pokatna
    opis: "Rozegrano opcjonalny prolog na ulicy Pokątnej (scena s1.scena.11)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.plotka-o-voldemorcie
    opis: "Postacie usłyszały plotkę o kimś, kto zbiera zwolenników (Czarny Pan, Voldemort, śmierciożercy; przy zasłonie na tematy czystości krwi bez imion i nazwisk, np. „ktoś, kogo nazywają Czarnym Panem”). Tylko plotka, bez potwierdzenia. Ustawiana zawsze w s1.scena.01 albo w prologu, niezależnie od tego, które nazwy padły."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.plotka-duch-puchona
    opis: "Postacie usłyszały szkolną plotkę o „duchu Puchona”: chłopcu w żółtym krawacie, którego ofiary Cassiana widziały tylko mignięciem. W s1.scena.01 ustawiana zawsze (Tobias o niej mówi; Gruby Mnich i Maisie Lock to dodatkowe źródła)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.ansel-odbicie
    opis: "Jedna z postaci przed straconą godziną widziała Ansela jako odbicie w szkle zegara (scena s1.scena.01). Jedyna forma, w jakiej Ansel pojawia się przed stratą."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.sekret-poruszony
    opis: "W grze ktoś dotknął wspólnego sekretu postaci z 4. roku (Ansel mimochodem albo Cassian w targu). Treść sekretu ustalają gracze i zapisuje się ją tekstem przy kartach postaci, nie we fladze."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.crake-poznany
    opis: "Postacie zamieniły kilka zdań z zegarmistrzem Hollisem Crake'iem (przelotna pogawędka)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.crake-dluga-rozmowa
    opis: "Dzięki bardzo wysokiemu wynikowi testu spostrzegawczości postać wciągnęła Crake'a w dłuższą rozmowę i zauważyła szczegół o jego córce."
    typ: bool
    wartosci: []
    sesja: s1

  # --- Lekcje ---
  - id: flaga.tempus-opanowane
    opis: "Co najmniej jedna postać umie rzucić Tempus (nauczone na lekcji Flitwicka w s1.scena.02 albo na korepetycjach; decyzja MG 2026-11-20)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.praca-domowa-dryf
    opis: "Flitwick zadał pracę domową: zmierzyć przesunięcie (dryf) trzech zegarów na różnych piętrach. Daje pretekst do wędrówek po zamku."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.sygnal-cassiana-nazwany
    opis: "Postać zauważyła i nazwała na głos sygnał Cassiana: dotknięcie kieszonki kamizelki z zegarkiem przed nienaturalnie szybkim ruchem."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.wren-podejrzewa
    opis: "Profesor Wren podejrzewa Cassiana i daje to postaciom odczuć: po wyrwaniu zegarka w pokazie (s1.scena.04; Wren oddaje zegarek Cassianowi, „pamiątka, nie dowód”), po uwadze o ocenach Vane'a (skoczyły w dwa tygodnie) albo po donosie (s1.scena.08)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.cassian-czujny
    opis: "Cassian zna twarz postaci, która próbowała zabrać albo obejrzeć jego zegarek przed sceną 08 (siatka bezpieczeństwa 1: śniadanie, Zaklęcia, pokaz u Wrena, kradzież w trakcie lekcji). Jest wobec niej czujny w s1.scena.04 i s1.scena.08 (modyfikator testu kradzieży „Cassian zna twarz”, liczby w karcie przedmiot.zegarek-cassiana). MG zapisuje, której postaci dotyczy. Ustawiana w scenach 01, 02, 04, 06, 07, 08 i 12 (przy próbie zabrania zegarka, oskarżeniu na ślepo albo ataku na Cassiana), w s1.scena.03 tylko przy próbie zabrania zegarka, nie przy samym pościgu."
    typ: bool
    wartosci: []
    sesja: s1

  # --- Stracona godzina i Ansel ---
  - id: flaga.godzina-stracona
    opis: "Cała drużyna straciła godzinę w przerwie między Zaklęciami a Obroną (s1.scena.03); od tej chwili postacie mogą widzieć Ansela i rozmawiać z nim."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.ansel-spotkany
    opis: "Postacie rozmawiały z Anselem (scena s1.scena.05 albo spotkanie wyrównujące)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.ansel-kontakt
    opis: "Liczba postaci graczy, które przynajmniej raz rozmawiały z Anselem (nie tylko mignięcie). Każda postać liczy się raz; MG prowadzi znacznik osobno przy każdej postaci. Przed sceną s1.scena.10 musi się równać liczbie graczy."
    typ: liczba
    wartosci: []
    sesja: s1
  - id: flaga.ansel-poza-spisem
    opis: "Postacie wiedzą, że Ansela nie ma w żadnym spisie (rejestr Hufflepuffu, biblioteka, inni go nie widzą)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.marrow-imie-znane
    opis: "Postacie wiedzą, że profesor Marrow istniała, uczyła astronomii i nie ma jej dziś w zamku (że odeszła dawno, potwierdza Fairweather albo Dumbledore)."
    typ: bool
    wartosci: []
    sesja: s1

  - id: flaga.dumbledore-powiadomiony
    opis: "Postacie powiedziały Dumbledore'owi o Anselu albo o straconych godzinach (dyrektor nie widzi Ansela, prosi o obserwację)."
    typ: bool
    wartosci: []
    sesja: s1

  # --- Śledztwo ---
  - id: flaga.przyplyw-ku-wiezy
    opis: "Postacie ustaliły, że zegary spóźniają się tym bardziej, im bliżej Wieży Zegarowej (przypływ czasu)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.slad-ukaszen
    opis: "Postacie odkryły drugi wzór: miejsca, w których ktoś podbiera czas, układają się w trasę do lochów i przejścia Slytherinu."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.rejestr-godzin
    opis: "Postacie dopasowały godziny stracone przez innych uczniów do nagłych sukcesów Cassiana."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.wieza-zbadana
    opis: "Postacie były w Wieży Zegarowej i wiedzą, że sama wieża jest czysta (to nie tu leży odpowiedź)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.plakietka-crake
    opis: "Postacie znalazły w wieży plakietkę „Crake i Córka, ulica Pokątna” i świeży olej (ziarno na Sesję 2)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.s1-zegar-kradziezy
    opis: "Zegar świata Sesji 1, 0–4: ile razy Cassian podebrał czas od chwili straconej godziny (s1.scena.03), a postacie go nie powstrzymały. +1 za każde pół dnia w fikcji; rośnie tylko wtedy, gdy flaga.zegarek-cassiana = u-cassiana i Cassian nie jest zdemaskowany (flaga.cassian-zdemaskowany); ta sama reguła warunkuje siatkę 6 (Cassian idzie do pracowni pierwszy). Progi w graf-scen.md Sesji 1."
    typ: liczba
    wartosci: []
    sesja: s1

  # --- Cassian ---
  - id: flaga.cassian-zdemaskowany
    opis: "Postacie wiedzą, że Cassian kradnie czas, i powiedziały mu to w twarz."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.cassian-los
    opis: "Jak Cassian wychodzi z konfrontacji w Sesji 1."
    typ: wybor
    wartosci: [nie-skonfrontowany, sojusznik, dluznik, rywal, ranny, uciekl, martwy]
    sesja: s1
  - id: flaga.zegarek-cassiana
    opis: "Gdzie jest zatrzymany zegarek kieszonkowy Cassiana, przez który działa magia karty. Do końca s1.scena.04 zawsze u-cassiana (decyzja MG 2026-11-20: przed pokazem nie da się go zdobyć, a wyrwany w pokazie Wren oddaje Cassianowi). Zmienia się najwcześniej po scenie 04: u-graczy (pojedynek, kradzież, targ, litość, zwykle w s1.scena.08), zniszczony (postacie go niszczą), skonfiskowany (nauczyciel albo Filch odbiera go postaciom, np. złapanym nocą)."
    typ: wybor
    wartosci: [u-cassiana, u-graczy, zniszczony, skonfiskowany]
    sesja: s1
  - id: flaga.zegarek-u-graczy
    opis: "Pomocnicza flaga bool: prawda, gdy flaga.zegarek-cassiana = u-graczy (kontrakt nie pozwala na warunek wartości w wymaga_flag). Warunek zakończenia „moc” (razem z flaga.karta-u-graczy). Fałsz po zniszczeniu, konfiskacie albo gdy zegarek wrócił do Cassiana."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.karta-u-graczy
    opis: "Postacie mają Kartę Pożyczającego, wyrwaną przez Cassiana z zaklętej księgi w pracowni Marrow. Działa tylko razem z zegarkiem Cassiana."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.lokalizacja-pracowni
    opis: "Postacie wiedzą, że wejście do pracowni jest w ostatnim rzędzie Działu Ksiąg Zakazanych."
    typ: bool
    wartosci: []
    sesja: s1

  # --- Pracownia i finał ---
  - id: flaga.pracownia-otwarta
    opis: "Postacie otworzyły ukryte drzwi i weszły do Sali Zatrzymanych Godzin."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.ksiega-zabezpieczenia
    opis: "Poziom zabezpieczeń zaklętej księgi w pracowni Marrow (przedmiot.zakleta-ksiega), 0–3: 0 = nietknięta; 1 = pierwsze dotknięcie, delikatne porażenie; 2 = kolejne dotknięcia, każde silniejsze; 3 = próba wyrwania kartki albo siłowego zabrania księgi, pełne zabezpieczenia i ucieczka. Po ucieczce następne dotknięcie w tej sesji zaczyna od 2."
    typ: liczba
    wartosci: []
    sesja: s1
  - id: flaga.ksiega-zlapani
    opis: "Pełne zabezpieczenia księgi złapały co najmniej jedną postać (nie zdążyła uciec przed trzynastym uderzeniem): ciężkie obrażenia i zaklęcie zapomnienia na ostatnie minuty w pracowni (siatka bezpieczeństwa 8 w graf-scen.md Sesji 1)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.pozyczona-chwila-poznana
    opis: "Postać nauczyła się ze ściany w pracowni sztuczki pożyczania chwili (mechanika kandydat: Pożyczona Chwila)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.gablota-sposob
    opis: "Jak otwarto gablotę z notatnikiem Marrow (przedmiot.dziennik-marrow)."
    typ: wybor
    wartosci: [oddana-godzina, podzielona-godzina, zabrana-godzina, wylamana, nieotwarta]
    sesja: s1
  - id: flaga.dziennik-u-graczy
    opis: "Postacie wyniosły notatnik Marrow z pracowni (prawda także wtedy, gdy potem go skonfiskowano; gdzie jest teraz, mówi flaga.dziennik-miejsce)."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.dziennik-miejsce
    opis: "Gdzie jest notatnik Marrow (przedmiot.dziennik-marrow) po Sesji 1."
    typ: wybor
    wartosci: [w-pracowni, u-graczy, skonfiskowany, u-cassiana, u-dumbledorea, zniszczony]
    sesja: s1
  - id: flaga.dziennik-skonfiskowany
    opis: "Pomocnicza flaga bool: prawda, gdy flaga.dziennik-miejsce = skonfiskowany (Filch albo nauczyciel odebrał notatnik). Używana w warunkach rozgałęzień finału (wyklucza_flagi), bo kontrakt nie pozwala na warunek wartości."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.wymark-slad
    opis: "Postacie zauważyły ślad Patrona (inicjały „S.W.” obok podpisu Marrow albo zdjęcie z 1951 z wysokim prefektem). Nazwiska jeszcze nie znają."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.filch-zlapal
    opis: "Filch przyłapał postacie nocą: w drodze do pracowni (siatka 9), po wypluciu przez pracownię (siatka 8) albo z notatnikiem po trzynastym biciu (siatka 4). Szlaban; o konfiskacie notatnika mówi wyłącznie flaga.dziennik-miejsce."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.trzynasta-wybila
    opis: "Wszystkie zegary w zamku wybiły trzynasty raz (trzynaście uderzeń, niezależnie od pory), a Ansel zaczął blednąć. Crake w Londynie to usłyszał."
    typ: bool
    wartosci: []
    sesja: s1
  - id: flaga.s1-wybor
    opis: "Co postacie postanawiają zrobić z notatnikiem i z Anselem (cliffhanger Sesji 1, ustawia Sesję 2)."
    typ: wybor
    wartosci: [dumbledore, sekret, moc, najpierw-chlopiec, skonfiskowany, inne, podzieleni, nierozstrzygniety]
    sesja: s1
