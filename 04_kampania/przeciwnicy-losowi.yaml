        zaklecia: {Flipendo: 0, Rictustempra: 0, Expelliarmus: 0}
        patronus: brak
        rozdzka: "Jabłoń, włos jednorożca; Duelling +1, Charms +1"
        zdrowie: {body: 0, mind: 0}
  - id: los.latwy-2
    poziom_trudnosci: latwy
    imie: "Dorothea Pilch"
    pewnosc: nasze
    opis: "Czwartoroczna Gryfonka z mugolskiej rodziny, szybka, głośna i uparta; zaczepia na korytarzu, bo ktoś obraził jej koleżankę z roku. Walczy bez finezji, ale biega szybciej od większości."
    styl: "Ulubione zaklęcie: Trip Jinx (podcina nogi), potem Expelliarmus, gdy cel już leży. Atak 1D10 + 7, unik 1D10 + 7, odporność 1D10 + 3. Najpierw wymienia po dwie akcje szybko, potem się rozkręca; po wytrąceniu różdżki wybucha śmiechem i prosi o rewanż („Jeszcze raz! Tym razem się nie dam”). Gdy przegrywa dwa razy z rzędu, ucieka biegiem (Speed 4). Można ją załatwić rozmową, jeśli postać nie wyśmieje jej pochodzenia."
