    poziom_trudnosci: sredni
    imie: "Ignatius Brae"
    pewnosc: nasze
    opis: "Szóstoroczny Krukon w okularach, który czyta o pojedynkach więcej, niż się pojedynkuje; chłodny, grzeczny, trochę protekcjonalny. Walczy z tarczą i cierpliwie czeka na błąd."
    styl: "Ulubione zaklęcie: Protego, potem Impedimenta albo Expelliarmus. Atak 1D10 + 10, unik 1D10 + 9, Protego 1D10 + 11, odporność 1D10 + 3. Deklaruje obronę przy każdej drugiej akcji (Protego zużywa akcję, ZD-07), więc atakuje rzadziej niż Cassian. Poddaje się przy drugim trafieniu albo gdy zostanie bez różdżki: „Zgoda. Dobrze to zrobiłeś”. Nie ucieka, bo uważa to za nieeleganckie. Nie bije się bez różdżki."
    staty:
