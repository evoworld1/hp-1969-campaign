  - id: los.niemozliwy-1
    poziom_trudnosci: niemozliwy
    imie: "Aldous Greave"
    pewnosc: nasze
    opis: "Wysoki czarodziej w podróżnym płaszczu, wiek nieokreślony, z twarzą, którą zapomina się po odwróceniu wzroku; nazwisko jest zapewne fałszywe. Może być aurorem na tropie, łowcą ciemnych magów albo wysłannikiem kręgu zwolenników Czarnego Pana: MG wybiera, kim jest (patrz styl)."
    styl: "To przeciwnik nie do pokonania: celem postaci jest przeżyć, uciec albo doczekać pomocy, nie wygrać. Atak 1D10 + 20, unik 1D10 + 15, Protego 1D10 + 17, odporność 1D10 + 6. Zawsze wygrywa inicjatywę i broni się Protego, a dwa ataki na rundę rzuca pewnie (Stupefy, Petrificus Totalus, Incarcerous). Nie zabija uczniów: jako auror obezwładnia i prowadzi do Dumbledore'a; jako zwolennik Czarnego Pana zbywa ich, zabiera, po co przyszedł, i znika (Obliviate na świadkach). Klątwy z listy Dark Arts (Crucio, Imperio) są w jego zasięgu, ale w Sesji 1 to ostateczność, tylko gdyby gracze same wymusili tragedię; wojna dopiero nadciąga, a Hogwart jest dla niego terenem obserwacji, nie polem bitwy. Zwykle kończy starcie po 2-3 rundach: nadchodzi Dumbledore albo któryś z profesorów, albo on sam stwierdza, że to nie ten dzień, i znika."
