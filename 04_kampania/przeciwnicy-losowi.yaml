    imie: "Aurelian Voss"
    pewnosc: nasze
    opis: "Siódmoroczny Krukon, mistrz szkolnych pojedynków, wysoki, spokojny, ubrany z przesadną dokładnością. Szanuje przeciwników, którzy walczą uczciwie, i nie znosi tych, którzy oszukują."
    styl: "Ulubione zaklęcie: Expelliarmus, potem Stupefy, gdy zasady pojedynku na to pozwalają. Atak 1D10 + 15, unik 1D10 + 10, Protego 1D10 + 13, odporność 1D10 + 4. Walczy formalnie: ukłon, odliczenie, brak ciosów w plecy; łamie rytm tylko wtedy, gdy przeciwnik złamie go pierwszy. Nie ucieka i nie poddaje się łatwo, ale przy dwóch własnych trafieniach i wytrąconej różdżce kończy z uśmiechem („Dobra walka”). Dobry sparingpartner: pokonany przez postać może stać się sojusznikiem na lata."
