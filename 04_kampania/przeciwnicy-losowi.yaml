  - id: los.trudny-1
    poziom_trudnosci: trudny
    imie: "Jasper Grimsditch"
    pewnosc: nasze
    opis: "Czterdziestolatek z zaplecza Hogsmeade: znoszony płaszcz, zbyt czyste ręce, uśmiech, który nie sięga oczu. Sprzedaje wszystko, co da się sprzedać, i ma pamięć do twarzy uczniów, którzy kiedyś go przyłapali."
    styl: "Ulubione zaklęcie: Stupefy, poprzedzone blefem albo pogawędką. Atak 1D10 + 13, unik 1D10 + 11, Protego 1D10 + 11, odporność 1D10 + 5. Wygrywa inicjatywę podstępem: zaczyna rozmowę i atakuje w połowie zdania. Nie lubi długich walk: jeśli traci dwa trafienia albo różdżkę, zostawia towar i ucieka (poza terenem szkoły teleportacją, na błoniach biegiem do Zakazanego Lasu albo Hogsmeade). Nie zabija i nie używa klątw; woli, żeby uczeń zasnął w krzakach. Dorosły łamiący przepisy w pobliżu zamku: po wygranej postaci zostaje pytanie, komu to zgłosić."
