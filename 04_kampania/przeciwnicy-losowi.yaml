# Przeciwnicy losowi: 7 gotowych kart do przypadkowego pojedynku albo bójki (panel MG: „Przypadkowy pojedynek”).
# status: szkic. Wszystkie postacie to nasze wymysły (pewnosc: nasze), rok 1969, Hogwart i okolice. Autor: mechanik (2026-11-22).
# Liczby wg tabeli poziomów Walkera s. 102 (suma cech i umiejętności) i wzoru kart NPC (02_zasady/walker/statystyki-npc.md).
# Rzuty (Walker s. 33, 41, 165): inicjatywa 1D10 + Speed + Duelling; atak 1D10 + Wits + Duelling + premia różdżki;
#   unik 1D10 + Speed + Wits; Protego 1D10 + Wits + Charms (tylko gdy opanowane, zużywa akcję, ZD-07);
#   odporność na obrażenia 1D10 + Vitality. Zaklęcia: ZD-06 (a), w walce trafiają tylko opanowane (0 = opanowane).
# Poziom trudności i „poziom” Walkera to dwie różne rzeczy: poziom_trudnosci to nasza etykieta dla MG, poziom to wiersz tabeli s. 102.
przeciwnicy:
  - id: los.latwy-1
    poziom_trudnosci: latwy        # latwy | sredni | trudny | niemozliwy
    imie: "Wilmot Pridd"
    pewnosc: nasze
    opis: "Trzecioroczny Puchon, drobny, z piegami i szatą o rozmiar za dużą; nie szuka kłótni, ale dał się podpuścić. Walczy ostrożnie, trzyma różdżkę oburącz i woła zaklęcie za głośno, więc widać z daleka, co rzuci."
    styl: "Ulubione zaklęcie: Flipendo, na zmianę z Rictustempra. Atak 1D10 + 6, unik 1D10 + 6, odporność 1D10 + 3. Pierwsze wytrącenie różdżki albo pierwsze trafienie i się poddaje („Dobra, dobra, wygraliście!”); ucieka, gdy w korytarzu pojawia się prefekt albo Filch. Nie używa Protego (nie opanował), nigdy nie celuje w twarz. Zwycięstwo nad nim nie daje nic poza kolorem; porażka z nim jest dla postaci wstydem (plotka w Wielkiej Sali)."
    staty:
      wartosci:
        rodzaj: czarodziej
        poziom: "Average student"     # tabela Walker s. 102; cechy 13 (zakres 11-18), umiejętności 21 (zakres 21-40)
        lineage: Half-blood
        school: "Hogwarts (1967)"
        year: 3
