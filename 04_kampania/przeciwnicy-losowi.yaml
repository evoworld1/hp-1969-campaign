  - id: los.sredni-2
    poziom_trudnosci: sredni
    imie: "Leopold Thrale"
    pewnosc: nasze
    opis: "Siódmoroczny Ślizgon, pałkarz drużyny, szeroki w barach, z uśmiechem człowieka, który lubi, gdy młodsi ustępują mu z drogi. Walczy agresywnie i szybko, lubi widzieć, jak przeciwnik ląduje na ziemi."
    styl: "Ulubione zaklęcie: Everte Statum, potem Stupefy. Atak 1D10 + 11, unik 1D10 + 9, odporność 1D10 + 5. Zaczyna od inicjatywy i dwóch ataków pod rząd (nie broni się tarczą, tylko unikiem). Stupefy rzuca w pojedynku nieformalnym dopiero od drugiej rundy; jeśli stół chce łagodniej, zostaje przy Everte Statum i Flipendo. Poddaje się dopiero po dwóch trafieniach i wytrąceniu różdżki, ale wtedy odchodzi z groźbą („Zapamiętam cię”). Gdy w pobliżu stoi nauczyciel, natychmiast przechodzi na uprzejmy ton."
