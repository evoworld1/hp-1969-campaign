# Druga strona na Netlify (panel graczy). W Netlify ustaw "Base directory" na: panel-gracze
# i zmienną środowiskową PINY_GRACZY (np. "zora-vos:123456,nell-ashford:234567,luna-lovedog:345678").
[build]
  command = "pip install pyyaml cryptography && python3 ../narzedzia/buduj-panel-gracze.py"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
